<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>KB専用タイマー</title>
<style>
  /* ===== テーマ変数（ライト＝既定, パステル基調） ===== */
  :root{
    --bg:#eef1f7;
    --surface:#ffffff;
    --surface2:#f1f3f9;
    --text:#2b3038;
    --text-sub:#7c8595;
    --border:#e2e6ef;
    --accent:#7ecfc0;
    --accent2:#9ad9a5;
    --on-accent:#1c2b28;
    --amber:#f2c879;
    --info:#8fbce6;
    --danger:#e58a8a;
    --shadow:0 6px 20px rgba(40,50,80,.06);
  }
  [data-theme="dark"]{
    --bg:#171a21;
    --surface:#1f232c;
    --surface2:#272c37;
    --text:#e7eaf0;
    --text-sub:#9aa3b2;
    --border:#30353f;
    --accent:#5ea89b;
    --accent2:#7bb387;
    --on-accent:#0e1614;
    --amber:#c9a862;
    --info:#6f97bd;
    --danger:#cf8585;
    --shadow:0 6px 22px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:56px 16px 16px;
    transition:background .2s,color .2s;
  }

  /* ===== 左上のアプリ名 ===== */
  .brand{
    position:fixed;top:16px;left:16px;z-index:50;
    font-size:12px;font-weight:600;letter-spacing:.02em;
    color:var(--text-sub);user-select:none;pointer-events:none;
  }

  /* ===== 右上ツールバー ===== */
  .toolbar{
    position:fixed;top:12px;right:14px;z-index:50;
    display:flex;gap:8px;
  }
  .toolbar button{
    width:38px;height:38px;padding:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text-sub);
    cursor:pointer;
    transition:background .12s,color .12s;
    box-shadow:var(--shadow);
  }
  .toolbar button:hover{background:var(--surface2);color:var(--text)}
  .toolbar button:active{transform:translateY(1px)}
  .toolbar svg{display:block}

  /* ===== レイアウト ===== */
  .app{width:100%;max-width:560px;margin:0 auto}

  /* ワイド（1画面, 高さ100vh以内, ページ全体はスクロールさせない） */
  body[data-eff-layout="wide"]{height:100vh;overflow:hidden;padding:0}
  body[data-eff-layout="wide"] .app{
    max-width:1200px;
    height:100vh;
    padding:52px 28px 40px;
    display:grid;
    grid-template-columns:1fr minmax(340px,420px); /* 右は固定幅寄り, 左は残り全部 */
    gap:30px;
    align-items:center;      /* 各カラムを縦中央に。右を畳んでも左は動かない */
  }
  body[data-eff-layout="wide"] .left{
    display:flex;flex-direction:column;gap:18px;min-height:0;
  }
  body[data-eff-layout="wide"] .left .display{
    margin:0 auto;width:100%;max-width:600px;padding:48px 32px 42px;
  }
  body[data-eff-layout="wide"] .left .controls{
    margin:0 auto;width:100%;max-width:600px;
  }
  body[data-eff-layout="wide"] .left .controls button{padding:17px 10px}
  /* ワイドのみ数字とフェーズ名を大きく（縦レイアウトは変更しない） */
  body[data-eff-layout="wide"] .time{font-size:clamp(72px,10vh + 2.5vw,140px)}
  body[data-eff-layout="wide"] .phase-name{font-size:clamp(28px,3vh + 1.5vw,48px)}
  body[data-eff-layout="wide"] .right{
    min-height:0;
    max-height:100%;         /* 溢れる場合のみ右カラム内スクロール。畳めば自然に短くなる */
    overflow-y:auto;
    padding-right:6px;
  }
  body[data-eff-layout="wide"] .right::-webkit-scrollbar{width:8px}
  body[data-eff-layout="wide"] .right::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

  /* ===== 表示パネル（タイマー） ===== */
  .display{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:26px 20px 22px;
    text-align:center;
    margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .status-pill{
    display:inline-block;font-size:12px;letter-spacing:.08em;
    padding:4px 12px;border-radius:999px;
    background:var(--surface2);color:var(--text-sub);
    margin-bottom:14px;border:1px solid var(--border);
  }
  .status-pill.running{color:var(--on-accent);background:var(--accent);border-color:transparent}
  .status-pill.paused{color:#4a3a00;background:var(--amber);border-color:transparent}
  .status-pill.waiting{color:var(--on-accent);background:var(--info);border-color:transparent}
  [data-theme="dark"] .status-pill.paused{color:#1a1204}

  .phase-name{
    font-size:clamp(22px,4vw,36px);
    font-weight:700;margin:0 0 6px;word-break:break-word;color:var(--accent);
  }
  .time{
    font-size:clamp(56px,12vw,104px);
    font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;
    line-height:1.05;margin:2px 0 10px;color:var(--text);
  }
  .sub{color:var(--text-sub);font-size:14px;min-height:1.4em}
  .sub .next{color:var(--text)}
  .cycles{color:var(--text-sub);font-size:13px;margin-top:4px}
  .wait-msg{color:var(--accent);font-size:15px;font-weight:600;margin-top:8px;min-height:1.4em}

  .bar{height:6px;background:var(--surface2);border-radius:999px;overflow:hidden;margin-top:16px}
  .bar > i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .2s linear}

  .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
  button{
    font:inherit;font-weight:600;color:var(--text);
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:14px 10px;cursor:pointer;
    transition:filter .12s,background .12s,transform .04s,opacity .12s;
    -webkit-tap-highlight-color:transparent;
  }
  button:hover{filter:brightness(.97)}
  [data-theme="dark"] button:hover{filter:brightness(1.12)}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
  button.danger{color:var(--danger)}

  /* ===== 設定パネル（余白を詰めて100vh以内に） ===== */
  details{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);
  }
  summary{
    cursor:pointer;padding:11px 14px;font-weight:600;list-style:none;
    display:flex;align-items:center;justify-content:space-between;user-select:none;
  }
  summary::-webkit-details-marker{display:none}
  summary::after{content:"▸";color:var(--text-sub);transition:transform .15s}
  details[open] summary::after{transform:rotate(90deg)}
  .body{padding:0 14px 12px}

  .phase-row{display:grid;grid-template-columns:1fr 62px 66px 34px;gap:6px;align-items:center;margin-bottom:6px}
  .phase-row .secsel{padding-left:7px;padding-right:6px}
  /* 分入力のスピナーを消して数字表示の幅を確保 */
  .phase-row input[type=number]{-moz-appearance:textfield;appearance:textfield}
  .phase-row input[type=number]::-webkit-outer-spin-button,
  .phase-row input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=text],input[type=number],input[type=time],select{
    font:inherit;width:100%;color:var(--text);
    background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:7px 9px;
  }
  select{cursor:pointer}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .unit{position:relative}
  .unit input{padding-right:24px}
  .unit::after{content:"分";position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--text-sub);font-size:13px;pointer-events:none}
  .iconbtn{padding:7px 0;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--danger);font-size:15px;line-height:1}
  .addbtn{width:100%;margin-top:2px;padding:9px 10px;background:transparent;border-style:dashed;color:var(--text-sub)}

  .field{margin:9px 0}
  .field:first-child{margin-top:0}
  .field > label{display:block;font-size:13px;color:var(--text-sub);margin-bottom:5px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .rowsel{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
  .rowsel button{padding:7px 14px}
  /* スライダーを ラベル/スライダー/数値 の1行に */
  .field.inline{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
  .field.inline > label{margin:0;white-space:nowrap}
  .field.inline input[type=range]{width:100%;accent-color:var(--accent)}
  .rangeval{min-width:48px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}

  .testbtn{margin-top:6px;width:100%;background:transparent;border-style:dashed;color:var(--text-sub)}
  .hint{color:var(--text-sub);font-size:12px;margin-top:7px;line-height:1.4}
  .warn{color:var(--danger);font-size:12px;margin-top:6px}
  .sched-item{border:1px solid var(--border);border-radius:10px;padding:9px;margin-bottom:9px;background:var(--surface2)}
  .sched-item .top{display:grid;grid-template-columns:1fr 36px;gap:7px;margin-bottom:7px}
  footer{color:var(--text-sub);font-size:11px;text-align:center;margin:8px 0 4px}
  body[data-eff-layout="wide"] footer{position:fixed;left:0;right:0;bottom:8px;margin:0} /* 下部中央に固定, 右カラムの高さに引きずられない */
</style>
</head>
<body>

<div class="brand">KB専用タイマー</div>

<div class="toolbar">
  <button id="themeBtn" type="button" title="テーマ切替"></button>
  <button id="layoutBtn" type="button" title="レイアウト切替"></button>
</div>

<div class="app">

  <div class="left">
    <div class="display">
      <span id="statusPill" class="status-pill">停止中</span>
      <h1 id="phaseName" class="phase-name">集中</h1>
      <div id="time" class="time">25:00</div>
      <div id="sub" class="sub"></div>
      <div id="cycles" class="cycles">サイクル: 0</div>
      <div id="waitMsg" class="wait-msg"></div>
      <div class="bar"><i id="barFill"></i></div>
    </div>

    <div class="controls">
      <button id="btnStart" class="primary">開始</button>
      <button id="btnPause" disabled>一時停止</button>
      <button id="btnSkip" disabled>スキップ</button>
      <button id="btnReset" class="danger" disabled>リセット</button>
    </div>
  </div>

  <div class="right">
    <details id="phasesPanel">
      <summary>フェーズ設定</summary>
      <div class="body">
        <div id="phaseList"></div>
        <button id="btnAddPhase" class="addbtn">＋ フェーズを追加</button>
      </div>
    </details>

    <details id="schedPanel">
      <summary>スケジュール</summary>
      <div class="body">
        <div class="field">
          <label>使用するスケジュール</label>
          <select id="schedSelect"></select>
        </div>
        <div id="schedList"></div>
        <button id="btnAddSched" class="addbtn">＋ スケジュールを追加</button>
        <div class="hint">選択中は「開始」で開始時刻まで待機し、時刻内なら即開始、終了時刻で自動停止します。「スケジュールなし」なら即開始します。終了が開始より前（日またぎ）は非対応です。</div>
      </div>
    </details>

    <details id="soundPanel">
      <summary>通知音</summary>
      <div class="body">
        <div class="field">
          <label>種類</label>
          <div class="rowsel">
            <select id="soundType">
              <option value="beep">ビープ</option>
              <option value="chime">チャイム</option>
              <option value="bell">ベル</option>
              <option value="soft">ソフト</option>
              <option value="none">なし（無音）</option>
            </select>
            <button id="btnTestSound">試聴</button>
          </div>
        </div>
        <div class="field inline">
          <label>鳴動時間</label>
          <input id="soundDur" type="range" min="0.5" max="10" step="0.5" value="3">
          <span id="soundDurVal" class="rangeval">3.0秒</span>
        </div>
        <div class="field inline">
          <label>音量</label>
          <input id="volume" type="range" min="0" max="100" step="1" value="50">
          <span id="volumeVal" class="rangeval">50%</span>
        </div>
      </div>
    </details>
  </div>
</div>

<footer id="appFooter">ローカル保存・オフライン動作 / index.html 単体</footer>

<script>
"use strict";

/* ---------- アプリのバージョン（変更はここだけ） ---------- */
const APP_VERSION = "1.2.0";

/* ---------- 設定の保存/復元 ---------- */
const LS_KEY = "loop-timer-settings-v2";

function newId(){ return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function makeDefaults(){
  return {
    phases: [ { name:"集中", seconds:1500 }, { name:"休憩", seconds:300 } ],
    soundDur: 3,
    soundType: "beep",       // beep|chime|bell|soft|none
    volume: 50,              // 0-100
    layout: "wide",          // wide|vertical
    theme: "light",          // light|dark
    schedules: [ { id:newId(), name:"仕事", start:"08:30", end:"17:00" } ],
    activeScheduleId: null    // null=スケジュールなし
  };
}

let settings = loadSettings();

function loadSettings(){
  const def = makeDefaults();
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return def;
    const s = JSON.parse(raw);

    // フェーズ（旧形式 min/minutes → 総秒数 seconds へマイグレーション）
    if(Array.isArray(s.phases) && s.phases.length){
      try{
        def.phases = s.phases.map(p => {
          const name = (p && typeof p.name === "string") ? p.name : "フェーズ";
          let sec;
          if(p && p.seconds !== undefined){
            const n = Number(p.seconds);
            if(!isFinite(n) || n <= 0) throw new Error("bad seconds");
            sec = sanitizeSeconds(n);
          }else if(p && (p.min !== undefined || p.minutes !== undefined)){
            const mv = Number(p.min !== undefined ? p.min : p.minutes);
            if(!isFinite(mv) || mv <= 0) throw new Error("bad minutes");
            sec = sanitizeSeconds(Math.round(mv * 60)); // 旧: 分(小数) → 秒
          }else{
            throw new Error("no duration");
          }
          return { name, seconds: sec };
        });
      }catch(e){
        // 変換失敗・不正値 → 初期値（集中25分 / 休憩5分）にフォールバック
        def.phases = makeDefaults().phases;
      }
    }
    // 通知音
    def.soundDur = clamp(Number(s.soundDur) || def.soundDur, 0.5, 10);
    if(["beep","chime","bell","soft","none"].includes(s.soundType)) def.soundType = s.soundType;
    if(s.volume !== undefined) def.volume = clamp(Number(s.volume), 0, 100);
    // 表示
    if(s.layout === "wide" || s.layout === "vertical") def.layout = s.layout;
    if(s.theme === "light" || s.theme === "dark") def.theme = s.theme;

    // スケジュール（旧 sched:{on,start,end} からの移行にも対応）
    if(Array.isArray(s.schedules)){
      const list = s.schedules
        .filter(x => x && typeof x === "object")
        .map(x => ({
          id: x.id || newId(),
          name: typeof x.name === "string" && x.name ? x.name : "スケジュール",
          start: isHHMM(x.start) ? x.start : "08:30",
          end: isHHMM(x.end) ? x.end : "17:00"
        }));
      if(list.length) def.schedules = list;
      def.activeScheduleId = s.activeScheduleId && list.some(x=>x.id===s.activeScheduleId)
        ? s.activeScheduleId : null;
    }else if(s.sched && typeof s.sched === "object"){
      const id = newId();
      def.schedules = [{ id, name:"仕事",
        start: isHHMM(s.sched.start) ? s.sched.start : "08:30",
        end: isHHMM(s.sched.end) ? s.sched.end : "17:00" }];
      def.activeScheduleId = s.sched.on ? id : null;
    }
    return def;
  }catch(e){
    return makeDefaults();
  }
}
function saveSettings(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(settings)); }catch(e){}
}
// 総秒数を整数化し、UIの10秒刻みに合わせて丸める。最小10秒（0秒は不可）。
function sanitizeSeconds(v){
  let n = Math.round(Number(v));
  if(!isFinite(n) || n <= 0) n = 10;
  n = Math.round(n / 10) * 10;
  if(n < 10) n = 10;
  return n;
}
function clamp(v,min,max){ return Math.min(max, Math.max(min, v)); }
function isHHMM(v){ return typeof v === "string" && /^\d{2}:\d{2}$/.test(v); }

/* ---------- 状態 ---------- */
// 'idle' | 'waiting' | 'running' | 'paused'
let state = "idle";
let phaseIndex = 0;
let cycleCount = 0;
let phaseEndTime = 0;
let pausedRemaining = 0;
let waitStartTs = 0;
let scheduleStopTs = 0;
let waitSchedName = "";

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const el = {
  statusPill:$("statusPill"), phaseName:$("phaseName"), time:$("time"),
  sub:$("sub"), cycles:$("cycles"), waitMsg:$("waitMsg"), barFill:$("barFill"),
  btnStart:$("btnStart"), btnPause:$("btnPause"), btnSkip:$("btnSkip"), btnReset:$("btnReset"),
  phaseList:$("phaseList"), btnAddPhase:$("btnAddPhase"),
  soundType:$("soundType"), soundDur:$("soundDur"), soundDurVal:$("soundDurVal"),
  volume:$("volume"), volumeVal:$("volumeVal"), btnTestSound:$("btnTestSound"),
  themeBtn:$("themeBtn"), layoutBtn:$("layoutBtn"),
  schedSelect:$("schedSelect"), schedList:$("schedList"), btnAddSched:$("btnAddSched")
};

/* ---------- フェーズごとのアクセント色 ---------- */
const ACCENTS = {
  light: ["#7ecfc0","#a99cd8","#f2a3a3","#f2c879","#8fbce6","#9ad9a5"],
  dark:  ["#5ea89b","#8a7fc0","#cf8585","#c9a862","#6f97bd","#7bb387"]
};
const ACCENTS2 = {
  light: ["#9ad9a5","#c4b9ea","#f7c1c1","#f7dca1","#b3d5f0","#bfe6c6"],
  dark:  ["#7bb387","#a99cd8","#e0a0a0","#dcc78a","#8fb0d0","#9ecfa6"]
};
function applyPhaseAccent(){
  const pal = ACCENTS[settings.theme] || ACCENTS.light;
  const pal2 = ACCENTS2[settings.theme] || ACCENTS2.light;
  const i = phaseIndex % pal.length;
  document.documentElement.style.setProperty("--accent", pal[i]);
  document.documentElement.style.setProperty("--accent2", pal2[i]);
}

/* ---------- フェーズ設定UI ---------- */
function renderPhases(){
  el.phaseList.innerHTML = "";
  settings.phases.forEach((p, i) => {
    const row = document.createElement("div");
    row.className = "phase-row";

    const name = document.createElement("input");
    name.type = "text"; name.value = p.name; name.placeholder = "名前";
    name.addEventListener("input", () => {
      settings.phases[i].name = name.value; saveSettings();
      if(state === "idle") refreshDisplay();
    });

    const total0 = settings.phases[i].seconds;

    // 分（整数）
    const unit = document.createElement("div"); unit.className = "unit";
    const min = document.createElement("input");
    min.type = "number"; min.min = "0"; min.step = "1"; min.value = Math.floor(total0 / 60);

    // 秒（10秒刻みセレクト）
    const sec = document.createElement("select");
    sec.className = "secsel";
    [0,10,20,30,40,50].forEach(v => {
      const o = document.createElement("option");
      o.value = String(v); o.textContent = v + "秒";
      sec.appendChild(o);
    });
    sec.value = String(total0 % 60);
    unit.appendChild(min);

    // 分・秒の変更を総秒数へ反映（0分0秒は10秒に補正）
    const commit = () => {
      const mv = Math.max(0, Math.floor(Number(min.value) || 0));
      const sv = Math.max(0, Number(sec.value) || 0);
      const t = sanitizeSeconds(mv * 60 + sv);
      settings.phases[i].seconds = t;
      min.value = Math.floor(t / 60);       // 補正結果を入力欄へ反映
      sec.value = String(t % 60);
      saveSettings();
      if(state === "idle") refreshDisplay();
    };
    min.addEventListener("input", commit);
    min.addEventListener("blur", commit);
    sec.addEventListener("change", commit);

    const del = document.createElement("button");
    del.className = "iconbtn"; del.textContent = "✕"; del.title = "削除";
    del.disabled = settings.phases.length <= 1;
    del.addEventListener("click", () => {
      if(settings.phases.length <= 1) return;
      settings.phases.splice(i, 1);
      if(phaseIndex >= settings.phases.length) phaseIndex = 0;
      saveSettings(); renderPhases();
      if(state === "idle") refreshDisplay();
    });

    row.appendChild(name); row.appendChild(unit); row.appendChild(sec); row.appendChild(del);
    el.phaseList.appendChild(row);
  });
}
el.btnAddPhase.addEventListener("click", () => {
  settings.phases.push({ name:"フェーズ" + (settings.phases.length + 1), seconds:300 });
  saveSettings(); renderPhases();
});

/* ---------- 通知音（Web Audio） ---------- */
let audioCtx = null;
// AudioContext は初回のユーザー操作時に生成し、以降は使い回す。
// suspended / interrupted(Safari固有) なら resume を試みる。
function ensureAudio(){
  try{
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
    }
    resumeAudioIfNeeded();
    return audioCtx;
  }catch(e){
    console.error("[KB Timer] AudioContext init failed:", e);
    return null;
  }
}
// suspended / interrupted なら resume。消音判定には一切使わない（resume のみが目的）。
function resumeAudioIfNeeded(){
  if(audioCtx && (audioCtx.state === "suspended" || audioCtx.state === "interrupted")){
    try{
      const p = audioCtx.resume();
      if(p && p.catch) p.catch(e => console.error("[KB Timer] AudioContext resume failed:", e));
    }catch(e){
      console.error("[KB Timer] AudioContext resume failed:", e);
    }
  }
}

// 通知音を鳴らす唯一の入口。種類が「なし」のときだけ鳴らさない（それ以外は常に鳴る）。
// OscillatorNode/GainNode を都度生成し、現在時刻から即座に start（未来時刻へは予約しない）。
// 指定秒数で必ず停止し、末尾はフェードアウト。音量スライダーの値を GainNode に反映。
// Safari 対策として、鳴らす直前に毎回 suspended/interrupted を確認し resume を await する。
async function emitSound(){
  if(settings.soundType === "none") return; // 早期returnは「なし」のときのみ
  try{
    const ctx = ensureAudio();
    if(!ctx) return;
    if(ctx.state === "suspended" || ctx.state === "interrupted"){
      try{ await ctx.resume(); }
      catch(e){ console.error("[KB Timer] AudioContext resume failed:", e); }
    }
    const now = ctx.currentTime;
    const dur = clamp(Number(settings.soundDur) || 3, 0.5, 10);
    const vol = clamp(Number(settings.volume) / 100, 0, 1);
    if(vol <= 0) return; // 音量0%は無音

    // マスター：フェードイン＋指定秒での末尾フェードアウト（プツッ音防止・確実に無音化）
    const master = ctx.createGain();
    master.connect(ctx.destination);
    const release = Math.min(0.5, dur * 0.35);
    const holdEnd = Math.max(0.02, dur - release);
    master.gain.setValueAtTime(0.0001, now);
    master.gain.exponentialRampToValueAtTime(vol, now + 0.02);
    master.gain.setValueAtTime(vol, now + holdEnd);
    master.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    const type = settings.soundType;
    const stopAt = now + dur + 0.05;

    // 1ボイス生成。oscは即時 start（osc.start()）。発音区間は GainNode の窓で作る。
    const voice = (wave, freq, peak, onAt, offAt) => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = wave;
      osc.frequency.setValueAtTime(freq, now);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.setValueAtTime(0.0001, onAt);                    // 発音開始まで無音を保持
      g.gain.exponentialRampToValueAtTime(peak, onAt + 0.02); // 素早い立ち上がり
      g.gain.exponentialRampToValueAtTime(0.0001, offAt);     // 減衰
      osc.connect(g); g.connect(master);
      osc.start();          // 現在時刻から即座に開始（未来予約なし）
      osc.stop(stopAt);
    };

    if(type === "beep"){
      // 和音ビープ
      voice("triangle", 660, 0.5, now, now + dur);
      voice("sine", 880, 0.22, now, now + dur);
      voice("sine", 1320, 0.22, now, now + dur);

    }else if(type === "chime"){
      // 下降アルペジオ 880 → 659 → 523（gain窓で順に鳴らす）
      const notes = [880, 659, 523];
      const step = dur / notes.length;
      notes.forEach((f, i) => voice("sine", f, 0.6, now + i * step, now + (i + 1) * step * 0.95));

    }else if(type === "bell"){
      // 高めの正弦波を長い減衰で（倍音を少し重ねる）
      voice("sine", 1200, 0.8, now, now + dur);
      voice("sine", 2400, 0.22, now, now + dur * 0.55);

    }else if(type === "soft"){
      // 三角波の柔らかい単音、アタックを緩やかに
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(600, now);
      const a = Math.min(0.35, dur * 0.3);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.75, now + a);
      g.gain.setValueAtTime(0.75, now + Math.max(a, dur - release));
      g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(g); g.connect(master);
      osc.start();
      osc.stop(stopAt);
    }
  }catch(e){
    console.error("[KB Timer] emitSound failed:", e);
  }
}

/* ---------- 無音キープアライブ（Safariのバックグラウンド停止対策） ---------- */
// タイマー動作中は音量ほぼ0の無音オシレータを鳴らし続け、AudioContextをアクティブに保つ。
// 通知音とは完全に別ノードで、emitSound() には影響しない。
let keepAlive = null;
function startKeepAlive(){
  const ctx = ensureAudio();
  if(!ctx || keepAlive) return;
  try{
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    g.gain.value = 0.0001;                 // 実質無音
    osc.frequency.value = 440;
    osc.connect(g); g.connect(ctx.destination);
    osc.start();
    keepAlive = { osc, g };
  }catch(e){
    console.error("[KB Timer] keepAlive start failed:", e);
  }
}
function stopKeepAlive(){
  if(!keepAlive) return;
  try{ keepAlive.osc.stop(); keepAlive.osc.disconnect(); keepAlive.g.disconnect(); }catch(e){}
  keepAlive = null;
}

// 可視性復帰・フォーカス時にも resume を試みる（消音判定には使わない）。
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible") resumeAudioIfNeeded();
});
window.addEventListener("focus", resumeAudioIfNeeded);

/* ---------- 時刻ユーティリティ ---------- */
function parseTimeToday(hhmm, baseMs){
  const [h, m] = hhmm.split(":").map(Number);
  const d = new Date(baseMs);
  d.setHours(h || 0, m || 0, 0, 0);
  return d.getTime();
}
function schedInvalid(sched){ return sched.end <= sched.start; } // 日またぎ非対応

// 選択中スケジュールに対して、次の開始/終了の絶対時刻を返す（日またぎ非対応）。
function computeSchedule(now, sched){
  const start = parseTimeToday(sched.start, now);
  const end = parseTimeToday(sched.end, now);
  let inWindowNow, curStop, nextStart, nextStop;
  inWindowNow = (now >= start && now < end);
  if(inWindowNow){ curStop = end; nextStart = start; nextStop = end; }
  else if(now < start){ nextStart = start; nextStop = end; }
  else { nextStart = start + 86400000; nextStop = end + 86400000; } // 今日は終了済 → 翌日
  return { inWindowNow, curStop, nextStart, nextStop };
}
function getActiveSchedule(){
  if(!settings.activeScheduleId) return null;
  return settings.schedules.find(s => s.id === settings.activeScheduleId) || null;
}

/* ---------- タイマー制御 ---------- */
function phaseDurationMs(i){ return settings.phases[i].seconds * 1000; }

function beginPhaseLoop(now, playSoundNow){
  state = "running";
  phaseEndTime = now + phaseDurationMs(phaseIndex);
  startKeepAlive(); // 動作中はAudioContextを維持（Safari対策）
  if(playSoundNow) emitSound();
  updateButtons();
}

el.btnStart.addEventListener("click", () => {
  ensureAudio(); // 自動再生制限対策：クリック時に生成/resume
  const now = Date.now();
  const active = getActiveSchedule();

  if(active){
    if(schedInvalid(active)){
      el.waitMsg.textContent = "「" + active.name + "」は終了が開始より前のため使用できません";
      return;
    }
    const sc = computeSchedule(now, active);
    phaseIndex = 0; cycleCount = 0;
    if(sc.inWindowNow){
      scheduleStopTs = sc.curStop;
      beginPhaseLoop(now, false);
    }else{
      state = "waiting";
      waitStartTs = sc.nextStart;
      scheduleStopTs = sc.nextStop;
      waitSchedName = active.name;
      startKeepAlive(); // 待機中もAudioContextを維持
      updateButtons();
    }
  }else{
    phaseIndex = 0; cycleCount = 0; scheduleStopTs = 0;
    beginPhaseLoop(now, false);
  }
  refreshDisplay();
});

el.btnPause.addEventListener("click", () => {
  if(state === "running"){
    pausedRemaining = Math.max(0, phaseEndTime - Date.now());
    state = "paused";
  }else if(state === "paused"){
    phaseEndTime = Date.now() + pausedRemaining;
    state = "running";
  }
  updateButtons(); refreshDisplay();
});

el.btnSkip.addEventListener("click", () => {
  if(state !== "running" && state !== "paused") return;
  advancePhase(Date.now(), true);
  if(state === "paused") pausedRemaining = phaseDurationMs(phaseIndex);
  refreshDisplay();
});

el.btnReset.addEventListener("click", resetToIdle);

function resetToIdle(){
  state = "idle";
  phaseIndex = 0; cycleCount = 0;
  phaseEndTime = 0; pausedRemaining = 0; waitStartTs = 0; scheduleStopTs = 0;
  waitSchedName = "";
  stopKeepAlive(); // 停止/リセット/スケジュール終了で無音オシレータを破棄
  updateButtons(); refreshDisplay();
}

// 次フェーズへ。絶対時刻を維持。silent の場合は通知音を鳴らさない（スリープ追いつき用）。
function advancePhase(now, resetAlignment, silent){
  phaseIndex = (phaseIndex + 1) % settings.phases.length;
  if(phaseIndex === 0) cycleCount++;
  phaseEndTime = resetAlignment ? (now + phaseDurationMs(phaseIndex))
                                : (phaseEndTime + phaseDurationMs(phaseIndex));
  if(!silent) emitSound();
}

/* ---------- 毎フレーム更新 ---------- */
function tick(){
  const now = Date.now();

  if(state === "waiting"){
    if(now >= waitStartTs){ phaseIndex = 0; beginPhaseLoop(now, true); }
  }

  if(state === "running"){
    if(scheduleStopTs && now >= scheduleStopTs){ resetToIdle(); return; }
    // 絶対時刻ベース。過ぎたフェーズはループ内では無音で一括処理し、
    // 進んだ場合のみ最後に1回だけ鳴らす（間引き復帰でも連続鳴動しない）。
    let guard = 0, advanced = 0;
    while(now >= phaseEndTime && guard < 10000){
      advancePhase(now, false, true); guard++; advanced++;
      if(scheduleStopTs && now >= scheduleStopTs){ resetToIdle(); return; }
    }
    if(advanced > 0) emitSound(); // まとめ処理でも最新の切替1回だけ鳴らす
  }
  refreshDisplay();
}

/* ---------- 表示更新 ---------- */
function fmt(ms){
  ms = Math.max(0, ms);
  const t = Math.ceil(ms / 1000);
  return String(Math.floor(t / 60)).padStart(2,"0") + ":" + String(t % 60).padStart(2,"0");
}
// 総秒数 → 「25分」「1分30秒」「30秒」表記
function durLabel(totalSec){
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  if(m > 0 && s > 0) return m + "分" + s + "秒";
  if(m > 0) return m + "分";
  return s + "秒";
}

function refreshDisplay(){
  const now = Date.now();
  const phases = settings.phases;
  const cur = phases[phaseIndex] || phases[0];
  const next = phases[(phaseIndex + 1) % phases.length];

  applyPhaseAccent();

  el.statusPill.className = "status-pill";
  if(state === "idle") el.statusPill.textContent = "停止中";
  else if(state === "waiting"){ el.statusPill.textContent = "待機中"; el.statusPill.classList.add("waiting"); }
  else if(state === "running"){ el.statusPill.textContent = "稼働中"; el.statusPill.classList.add("running"); }
  else if(state === "paused"){ el.statusPill.textContent = "一時停止"; el.statusPill.classList.add("paused"); }

  el.phaseName.textContent = cur ? cur.name : "-";

  let remaining, fullMs;
  if(state === "running"){ remaining = phaseEndTime - now; fullMs = phaseDurationMs(phaseIndex); }
  else if(state === "paused"){ remaining = pausedRemaining; fullMs = phaseDurationMs(phaseIndex); }
  else { remaining = phaseDurationMs(phaseIndex); fullMs = remaining; }

  el.time.textContent = fmt(remaining);

  const shown = (phases.length > 1) ? next : cur;
  el.sub.innerHTML = '次: <span class="next">' + escapeHtml(shown.name) + "（" + durLabel(shown.seconds) + "）</span>";
  el.cycles.textContent = "サイクル: " + cycleCount;

  let pct = 0;
  if(fullMs > 0) pct = clamp((1 - remaining / fullMs) * 100, 0, 100);
  el.barFill.style.width = pct.toFixed(1) + "%";

  if(state === "waiting"){
    const diff = Math.max(0, waitStartTs - now);
    const hh = Math.floor(diff / 3600000);
    const mm = Math.floor((diff % 3600000) / 60000);
    const startD = new Date(waitStartTs);
    const hhmm = String(startD.getHours()).padStart(2,"0") + ":" + String(startD.getMinutes()).padStart(2,"0");
    let left = hh > 0 ? ("あと" + hh + "時間" + mm + "分") : (mm > 0 ? ("あと" + mm + "分") : "まもなく");
    const nm = waitSchedName ? "「" + waitSchedName + "」 " : "";
    el.waitMsg.textContent = nm + hhmm + "に開始します（" + left + "）";
  }else if(state !== "idle"){
    el.waitMsg.textContent = "";
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------- ボタン状態 ---------- */
function updateButtons(){
  const active = (state === "running" || state === "paused" || state === "waiting");
  el.btnStart.disabled = active;
  el.btnPause.disabled = !(state === "running" || state === "paused");
  el.btnSkip.disabled = !(state === "running" || state === "paused");
  el.btnReset.disabled = !active;
  el.btnPause.textContent = (state === "paused") ? "再開" : "一時停止";
}

/* ---------- 通知音UI ---------- */
function setSoundDurLabel(){ el.soundDurVal.textContent = Number(settings.soundDur).toFixed(1) + "秒"; }
function setVolumeLabel(){ el.volumeVal.textContent = Math.round(settings.volume) + "%"; }
el.soundType.addEventListener("change", () => { settings.soundType = el.soundType.value; saveSettings(); });
el.soundDur.addEventListener("input", () => {
  settings.soundDur = clamp(Number(el.soundDur.value), 0.5, 10); setSoundDurLabel(); saveSettings();
});
el.volume.addEventListener("input", () => {
  settings.volume = clamp(Number(el.volume.value), 0, 100); setVolumeLabel(); saveSettings();
});
el.btnTestSound.addEventListener("click", () => {
  ensureAudio();
  emitSound();
});

/* ---------- レイアウト / テーマ（右上ツールバー） ---------- */
const SVG = {
  sun: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
  moon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  wide: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="7.5" height="16" rx="1.2"/><rect x="13.5" y="4" width="7.5" height="16" rx="1.2"/></svg>',
  vert: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="4" width="14" height="16" rx="1.2"/></svg>'
};
let lastEffLayout = null;

function computeEffectiveLayout(){
  return (settings.layout === "wide" && window.innerWidth >= 768) ? "wide" : "vertical";
}
function applySectionCollapse(eff){
  const open = (eff === "wide");
  ["phasesPanel","schedPanel","soundPanel"].forEach(id => { const d = $(id); if(d) d.open = open; });
}
function updateToolbar(){
  const isDark = settings.theme === "dark";
  el.themeBtn.innerHTML = isDark ? SVG.moon : SVG.sun;
  el.themeBtn.title = isDark ? "ライトテーマに切り替え" : "ダークテーマに切り替え";
  const isWide = settings.layout === "wide";
  el.layoutBtn.innerHTML = isWide ? SVG.wide : SVG.vert;
  el.layoutBtn.title = isWide ? "縦レイアウトに切り替え" : "ワイドレイアウトに切り替え";
  el.layoutBtn.hidden = (window.innerWidth < 768); // 768px未満はレイアウト切替を隠す
}
function applyLayout(){
  const eff = computeEffectiveLayout();
  document.body.dataset.effLayout = eff;
  updateToolbar();
  if(eff !== lastEffLayout){ applySectionCollapse(eff); lastEffLayout = eff; }
}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", settings.theme);
  updateToolbar();
  applyPhaseAccent();
}
el.themeBtn.addEventListener("click", () => {
  settings.theme = (settings.theme === "dark") ? "light" : "dark";
  saveSettings(); applyTheme();
});
el.layoutBtn.addEventListener("click", () => {
  settings.layout = (settings.layout === "wide") ? "vertical" : "wide";
  saveSettings(); applyLayout();
});
window.addEventListener("resize", applyLayout);

/* ---------- スケジュールUI（複数管理） ---------- */
function renderSchedSelect(){
  el.schedSelect.innerHTML = "";
  const none = document.createElement("option");
  none.value = ""; none.textContent = "スケジュールなし";
  el.schedSelect.appendChild(none);
  settings.schedules.forEach(s => {
    const o = document.createElement("option");
    o.value = s.id;
    o.textContent = s.name + "（" + s.start + "〜" + s.end + "）";
    el.schedSelect.appendChild(o);
  });
  el.schedSelect.value = settings.activeScheduleId || "";
}
function renderSchedList(){
  el.schedList.innerHTML = "";
  settings.schedules.forEach((s, i) => {
    const item = document.createElement("div"); item.className = "sched-item";

    const top = document.createElement("div"); top.className = "top";
    const name = document.createElement("input");
    name.type = "text"; name.value = s.name; name.placeholder = "名前";
    name.addEventListener("input", () => { settings.schedules[i].name = name.value; saveSettings(); renderSchedSelect(); });

    const del = document.createElement("button");
    del.className = "iconbtn"; del.textContent = "✕"; del.title = "削除";
    del.addEventListener("click", () => {
      const removedId = settings.schedules[i].id;
      settings.schedules.splice(i, 1);
      if(settings.activeScheduleId === removedId) settings.activeScheduleId = null;
      saveSettings(); renderSchedList(); renderSchedSelect();
    });
    top.appendChild(name); top.appendChild(del);

    const row2 = document.createElement("div"); row2.className = "row2";
    const startWrap = document.createElement("div");
    const startLbl = document.createElement("label"); startLbl.textContent = "開始"; startLbl.style.cssText = "display:block;font-size:12px;color:var(--text-sub);margin-bottom:4px";
    const start = document.createElement("input"); start.type = "time"; start.value = s.start;
    const endWrap = document.createElement("div");
    const endLbl = document.createElement("label"); endLbl.textContent = "終了"; endLbl.style.cssText = startLbl.style.cssText;
    const end = document.createElement("input"); end.type = "time"; end.value = s.end;

    const warn = document.createElement("div"); warn.className = "warn";
    const refreshWarn = () => {
      warn.textContent = schedInvalid(settings.schedules[i])
        ? "終了が開始より前です（日またぎ非対応・使用不可）" : "";
    };
    start.addEventListener("input", () => { settings.schedules[i].start = start.value || "00:00"; saveSettings(); renderSchedSelect(); refreshWarn(); });
    end.addEventListener("input", () => { settings.schedules[i].end = end.value || "00:00"; saveSettings(); renderSchedSelect(); refreshWarn(); });

    startWrap.appendChild(startLbl); startWrap.appendChild(start);
    endWrap.appendChild(endLbl); endWrap.appendChild(end);
    row2.appendChild(startWrap); row2.appendChild(endWrap);

    item.appendChild(top); item.appendChild(row2); item.appendChild(warn);
    el.schedList.appendChild(item);
    refreshWarn();
  });
}
el.schedSelect.addEventListener("change", () => {
  settings.activeScheduleId = el.schedSelect.value || null;
  saveSettings();
});
el.btnAddSched.addEventListener("click", () => {
  settings.schedules.push({ id:newId(), name:"スケジュール" + (settings.schedules.length + 1), start:"09:00", end:"18:00" });
  saveSettings(); renderSchedList(); renderSchedSelect();
});

/* ---------- 初期化 ---------- */
function initFromSettings(){
  const footer = $("appFooter");
  if(footer) footer.textContent = "v" + APP_VERSION + " / ローカル保存・オフライン動作 / index.html 単体";
  saveSettings(); // マイグレーション結果を新形式で保存し直す（旧形式を残さない）
  renderPhases();
  el.soundType.value = settings.soundType;
  el.soundDur.value = settings.soundDur; setSoundDurLabel();
  el.volume.value = settings.volume; setVolumeLabel();
  renderSchedList(); renderSchedSelect();
  applyTheme();
  applyLayout();
  updateButtons();
  refreshDisplay();
}

initFromSettings();
setInterval(tick, 250);
</script>
